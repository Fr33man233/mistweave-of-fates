name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run deterministic, production-boundary, and desktop browser gates
        run: pnpm test:automation
      - name: Verify Pages manifest base
        run: node -e "const fs=require('node:fs');const m=JSON.parse(fs.readFileSync('dist/manifest.webmanifest','utf8'));if(m.start_url!=='/mistweave-of-fates/'||m.scope!=='/mistweave-of-fates/')throw new Error('Pages manifest base mismatch')"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - id: deployment
        uses: actions/deploy-pages@v4
